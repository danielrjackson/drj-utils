[project]
    name            = "DRJ-Utils"
    version         = "0.1.0"
    description     = "Common utilities shared across my projects"
    authors         = [{ name = "Daniel Jackson", email = "643707+danielrjackson@users.noreply.github.com" }]
    requires-python = "~=3.13"      # Newest version of python
    readme          = { file = "README.md", content-type = "text/markdown" }
    license         = { file = "LICENSE.md" }
    dependencies    = [
        "attrs>=26.1.0",
        "casefy>=1.1.0", # String manipulation
        "keyring>=25.7.0", # Access API Keys from system credential manager
        "mcp[cli]>=2.3.0", # Model Context Protocol CLI interface
        "pydantic>=2.14.1", # Data validation and settings management
        "pyyaml>=6.0.3", # Read YAML files
        "regex>=2026.9.29", # Regular expression operations
        "sympy>=1.14.0", # Symbolic mathematics library
]

[project.optional-dependencies]
    dev = [
        "coverage>=7.17.0",       # Test coverage report
        "hypothesis>=6.170.13",   # Fuzzy testing
        "pytest>=9.2.0",         # Python testing library
    ]

[build-system]
    requires        = ["hatchling>=1.33.0"]
    build-backend   = "hatchling.build"

[tool.hatch.build.targets.wheel]
    packages = ["src/drjutils"]

[tool.pytest.ini_options]
    pythonpath = ["src"]

[tool.uv]
    package = false
